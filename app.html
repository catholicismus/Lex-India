<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Dialer App</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .dialer-card {
      background: #1e1e1e;
      border-radius: 20px;
      padding: 24px;
      width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .id-banner {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 16px;
    }
    .id-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .id-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .id-value {
      font-size: 0.95rem;
      font-weight: bold;
      color: #29b6f6;
      word-break: break-all;
      text-align: left;
      flex: 1;
    }
    .btn-copy {
      background: #333;
      border: 1px solid #444;
      border-radius: 6px;
      color: #00e676;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-copy:active { background: #444; }

    .display-container {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .display {
      flex: 1;
      height: 50px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      text-align: center;
      padding: 0 8px;
    }
    .display:focus {
      outline: 1px solid #29b6f6;
      border-color: #29b6f6;
    }
    .btn-paste {
      background: #333;
      border: 1px solid #444;
      border-radius: 8px;
      color: #29b6f6;
      font-weight: bold;
      padding: 0 12px;
      cursor: pointer;
    }
    .btn-paste:active { background: #444; }
    
    .keypad-nums {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .key-num {
      background: #2c2c2c;
      border: none;
      border-radius: 12px;
      height: 48px;
      font-size: 1.2rem;
      color: #fff;
      cursor: pointer;
    }
    .key-num:active { background: #444; }

    .actions { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-call { background: #00c853; color: white; }
    .btn-hangup { background: #d50000; color: white; }
  </style>
</head>
<body>

<div class="dialer-card">
  <h3>Web Data Dialer</h3>

  <div class="id-banner">
    <div class="id-label">Your Caller ID</div>
    <div class="id-row">
      <div id="my-id" class="id-value">Requesting Mic Access...</div>
      <button id="copy-btn" class="btn-copy" onclick="copyCallerID()" style="display:none;">Copy</button>
    </div>
  </div>
  
  <div class="display-container">
    <input type="text" id="display" class="display" placeholder="Tap to type Target ID" />
    <button class="btn-paste" onclick="pasteFromClipboard()">Paste</button>
  </div>

  <div class="keypad-nums">
    <button class="key-num" onclick="append('1')">1</button>
    <button class="key-num" onclick="append('2')">2</button>
    <button class="key-num" onclick="append('3')">3</button>
    <button class="key-num" onclick="append('4')">4</button>
    <button class="key-num" onclick="append('5')">5</button>
    <button class="key-num" onclick="append('6')">6</button>
    <button class="key-num" onclick="append('7')">7</button>
    <button class="key-num" onclick="append('8')">8</button>
    <button class="key-num" onclick="append('9')">9</button>
    <button class="key-num" onclick="append('-')">-</button>
    <button class="key-num" onclick="append('0')">0</button>
    <button class="key-num" onclick="clearDisplay()">⌫</button>
  </div>

  <div class="actions">
    <button class="btn btn-call" onclick="makeCall()">Call</button>
    <button class="btn btn-hangup" onclick="hangUp()">End</button>
  </div>
  
  <audio id="remote-audio" autoplay></audio>
</div>

<script>
  let peer;
  let activeCall;
  let localStream;
  let currentCallerId = "";

  window.addEventListener('DOMContentLoaded', () => {
    promptMicrophonePermission();
  });

  function promptMicrophonePermission() {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        localStream = stream;
        document.getElementById('my-id').innerText = "Connecting...";
        initPeer();
      })
      .catch(err => {
        const idElement = document.getElementById('my-id');
        idElement.innerText = "Tap Here to Allow Mic";
        idElement.style.color = "#ff9800";
        idElement.style.cursor = "pointer";
        idElement.onclick = promptMicrophonePermission;
      });
  }

  function initPeer() {
    peer = new Peer();

    peer.on('open', id => {
      currentCallerId = id;
      const idElement = document.getElementById('my-id');
      idElement.innerText = id;
      idElement.style.color = "#00e676";
      idElement.onclick = null;
      document.getElementById('copy-btn').style.display = "block";
    });

    peer.on('call', call => {
      call.answer(localStream);
      activeCall = call;
      call.on('stream', remoteStream => {
        document.getElementById('remote-audio').srcObject = remoteStream;
      });
    });

    peer.on('error', err => {
      const idElement = document.getElementById('my-id');
      idElement.innerText = "Connection Error";
      idElement.style.color = "#ff5252";
      document.getElementById('copy-btn').style.display = "none";
    });
  }

  async function copyCallerID() {
    if (!currentCallerId) return;
    try {
      await navigator.clipboard.writeText(currentCallerId);
      const btn = document.getElementById('copy-btn');
      btn.innerText = "Copied!";
      setTimeout(() => { btn.innerText = "Copy"; }, 2000);
    } catch (err) {
      alert("Failed to copy automatically. Please select text manually.");
    }
  }

  function append(val) {
    document.getElementById('display').value += val;
  }

  function clearDisplay() {
    let current = document.getElementById('display').value;
    document.getElementById('display').value = current.slice(0, -1);
  }

  async function pasteFromClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById('display').value = text.trim();
    } catch (err) {
      alert("Please manually paste using system long-press.");
    }
  }

  function makeCall() {
    const targetId = document.getElementById('display').value.trim();
    if (!targetId || !localStream) return;

    const call = peer.call(targetId, localStream);
    activeCall = call;

    call.on('stream', remoteStream => {
      document.getElementById('remote-audio').srcObject = remoteStream;
    });
  }

  function hangUp() {
    if (activeCall) {
      activeCall.close();
    }
  }
</script>

</body>
</html>
