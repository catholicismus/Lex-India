<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Dialer App</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .dialer-card {
      background: #1e1e1e;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .app-title {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.25rem;
      font-weight: 600;
      color: #e0e0e0;
    }
    .id-banner {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .id-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .id-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .id-value {
      font-size: 0.95rem;
      font-weight: bold;
      color: #00e676;
      word-break: break-all;
      text-align: left;
      flex: 1;
    }
    .btn-action {
      background: #333;
      border: 1px solid #444;
      border-radius: 6px;
      color: #29b6f6;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-action:active { background: #444; }

    .display-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .display {
      flex: 1;
      height: 48px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      text-align: center;
      padding: 0 12px;
    }
    .display:focus {
      outline: none;
      border-color: #29b6f6;
    }

    .page-view { display: none; }
    .page-view.active { display: block; }

    .call-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 2px solid #29b6f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 16px;
    }
    .incoming-avatar {
      border-color: #00c853;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.4); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(0, 200, 83, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
    }
    .call-status-text {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .timer {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 24px;
    }

    .actions { display: flex; gap: 12px; }
    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-call { background: #00c853; color: white; }
    .btn-accept { background: #00c853; color: white; }
    .btn-reject { background: #d50000; color: white; }
    .btn-end { background: #d50000; color: white; width: 100%; }
  </style>
</head>
<body>

<div class="dialer-card">
  <h3 class="app-title">Web Data Dialer</h3>

  <!-- 1. DIAL PAGE -->
  <div id="dial-page" class="page-view active">
    <div class="id-banner">
      <div class="id-label">Permanent Caller ID</div>
      <div class="id-row">
        <div id="my-id" class="id-value">Connecting...</div>
        <button id="copy-btn" class="btn-action" onclick="copyCallerID()">Copy</button>
        <button class="btn-action" onclick="changePermanentID()">Edit</button>
      </div>
    </div>
    
    <div class="display-container">
      <input type="text" id="display" class="display" placeholder="Enter Target ID" />
      <button class="btn-action" onclick="pasteFromClipboard()">Paste</button>
    </div>

    <div class="actions">
      <button class="btn btn-call" onclick="makeCall()">Call</button>
    </div>
  </div>

  <!-- 2. INCOMING CALL PAGE -->
  <div id="receive-page" class="page-view">
    <div class="call-avatar incoming-avatar">📞</div>
    <div class="call-status-text">Incoming Call...</div>
    <div id="caller-id-display" class="timer">Unknown Caller</div>
    
    <div class="actions">
      <button class="btn btn-accept" onclick="acceptCall()">Accept</button>
      <button class="btn btn-reject" onclick="rejectCall()">Reject</button>
    </div>
  </div>

  <!-- 3. SPEAKING PAGE -->
  <div id="speaking-page" class="page-view">
    <div class="call-avatar">🎙️</div>
    <div class="call-status-text">In Conversation</div>
    <div id="call-timer" class="timer">00:00</div>
    
    <div class="actions">
      <button class="btn btn-end" onclick="hangUp()">End Call</button>
    </div>
  </div>
  
  <audio id="remote-audio" autoplay></audio>
</div>

<script>
  let peer;
  let activeCall;
  let incomingCallInstance;
  let localStream;
  let currentCallerId = "";
  let callTimerInterval;
  let secondsElapsed = 0;
  let ringtoneAudioContext;

  window.addEventListener('DOMContentLoaded', () => {
    promptMicrophonePermission();
  });

  function promptMicrophonePermission() {
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        localStream = stream;
        document.getElementById('my-id').innerText = "Initializing ID...";
        initPermanentPeer();
      })
      .catch(err => {
        const idElement = document.getElementById('my-id');
        idElement.innerText = "Tap Here to Allow Mic";
        idElement.style.color = "#ff9800";
        idElement.style.cursor = "pointer";
        idElement.onclick = promptMicrophonePermission;
      });
  }

  function getPermanentID() {
    let storedId = localStorage.getItem('dialer_permanent_id');
    if (!storedId) {
      storedId = 'user-' + Math.random().toString(36).substring(2, 7);
      localStorage.setItem('dialer_permanent_id', storedId);
    }
    return storedId;
  }

  function initPermanentPeer() {
    const permanentId = getPermanentID();

    peer = new Peer(permanentId);

    peer.on('open', id => {
      currentCallerId = id;
      const idElement = document.getElementById('my-id');
      idElement.innerText = id;
      idElement.style.color = "#00e676";
      idElement.onclick = null;
    });

    peer.on('call', call => {
      incomingCallInstance = call;
      document.getElementById('caller-id-display').innerText = call.peer;
      showPage('receive-page');
      playRingtone();
    });

    peer.on('error', err => {
      if (err.type === 'unavailable-id') {
        alert("This Permanent ID is already active on another device/tab. Assigning a new ID.");
        localStorage.removeItem('dialer_permanent_id');
        initPermanentPeer();
      } else {
        const idElement = document.getElementById('my-id');
        idElement.innerText = "Connection Error";
        idElement.style.color = "#ff5252";
      }
    });
  }

  function changePermanentID() {
    const newId = prompt("Enter a custom Permanent ID (letters, numbers, hyphens only):", currentCallerId);
    if (newId && newId.trim() !== "" && newId !== currentCallerId) {
      const cleanId = newId.trim().toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (cleanId.length === 0) {
        alert("Invalid ID format.");
        return;
      }
      localStorage.setItem('dialer_permanent_id', cleanId);
      if (peer) peer.destroy();
      initPermanentPeer();
    }
  }

  function showPage(pageId) {
    document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
  }

  function makeCall() {
    const targetId = document.getElementById('display').value.trim();
    if (!targetId || !localStream) return;

    const call = peer.call(targetId, localStream);
    activeCall = call;

    showPage('speaking-page');
    startTimer();

    call.on('stream', remoteStream => {
      document.getElementById('remote-audio').srcObject = remoteStream;
    });

    call.on('close', () => {
      resetToDialPage();
    });
  }

  function acceptCall() {
    stopRingtone();
    if (!incomingCallInstance) return;

    incomingCallInstance.answer(localStream);
    activeCall = incomingCallInstance;

    showPage('speaking-page');
    startTimer();

    activeCall.on('stream', remoteStream => {
      document.getElementById('remote-audio').srcObject = remoteStream;
    });

    activeCall.on('close', () => {
      resetToDialPage();
    });
  }

  function rejectCall() {
    stopRingtone();
    if (incomingCallInstance) {
      incomingCallInstance.close();
    }
    resetToDialPage();
  }

  function hangUp() {
    stopRingtone();
    if (activeCall) {
      activeCall.close();
    }
    resetToDialPage();
  }

  function resetToDialPage() {
    stopTimer();
    showPage('dial-page');
    activeCall = null;
    incomingCallInstance = null;
  }

  function startTimer() {
    secondsElapsed = 0;
    document.getElementById('call-timer').innerText = "00:00";
    clearInterval(callTimerInterval);
    callTimerInterval = setInterval(() => {
      secondsElapsed++;
      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('call-timer').innerText = `${mins}:${secs}`;
    }, 1000);
  }

  function stopTimer() {
    clearInterval(callTimerInterval);
  }

  function playRingtone() {
    try {
      ringtoneAudioContext = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ringtoneAudioContext.createOscillator();
      const gain = ringtoneAudioContext.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, ringtoneAudioContext.currentTime);
      gain.gain.setValueAtTime(0.1, ringtoneAudioContext.currentTime);
      osc.connect(gain);
      gain.connect(ringtoneAudioContext.destination);
      osc.start();
      osc.stop(ringtoneAudioContext.currentTime + 3);
    } catch(e) {}
  }

  function stopRingtone() {
    if (ringtoneAudioContext) {
      ringtoneAudioContext.close();
      ringtoneAudioContext = null;
    }
  }

  async function copyCallerID() {
    if (!currentCallerId) return;
    try {
      await navigator.clipboard.writeText(currentCallerId);
      const btn = document.getElementById('copy-btn');
      btn.innerText = "Copied!";
      setTimeout(() => { btn.innerText = "Copy"; }, 2000);
    } catch (err) {
      alert("Please copy the ID manually.");
    }
  }

  async function pasteFromClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById('display').value = text.trim();
    } catch (err) {
      alert("Please long-press the target field to paste.");
    }
  }
</script>

</body>
</html>
