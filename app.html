<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Dialer & Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .dialer-card {
      background: #1e1e1e;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .app-title {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.25rem;
      font-weight: 600;
      color: #e0e0e0;
    }
    .id-banner {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .id-label {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .id-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .id-value {
      font-size: 0.95rem;
      font-weight: bold;
      color: #00e676;
      word-break: break-all;
      text-align: left;
      flex: 1;
    }
    .btn-action {
      background: #333;
      border: 1px solid #444;
      border-radius: 6px;
      color: #29b6f6;
      font-weight: bold;
      font-size: 0.8rem;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .btn-action:active { background: #444; }

    .display-container {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .display {
      flex: 1;
      height: 48px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      text-align: center;
      padding: 0 12px;
    }
    .display:focus {
      outline: none;
      border-color: #29b6f6;
    }

    .call-mode-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: #aaa;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #29b6f6; }
    input:checked + .slider:before { transform: translateX(20px); }

    .page-view { display: none; }
    .page-view.active { display: block; }

    .video-viewport {
      position: relative;
      width: 100%;
      height: 220px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .remote-video { width: 100%; height: 100%; }
    .local-video {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 80px;
      height: 100px;
      border-radius: 8px;
      border: 2px solid #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .call-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #2a2a2a;
      border: 2px solid #29b6f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin: 0 auto 12px;
    }
    .incoming-avatar {
      border-color: #00c853;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.4); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(0, 200, 83, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
    }
    .call-status-text {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .timer {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 12px;
    }

    .chat-container {
      background: #141414;
      border: 1px solid #333;
      border-radius: 10px;
      height: 220px;
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }
    .chat-messages {
      flex: 1;
      padding: 8px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .msg {
      padding: 6px 10px;
      border-radius: 12px;
      max-width: 80%;
      word-break: break-word;
    }
    .msg.me {
      background: #0288d1;
      align-self: flex-end;
      color: #fff;
    }
    .msg.them {
      background: #333;
      align-self: flex-start;
      color: #fff;
    }
    .msg.system {
      background: transparent;
      color: #888;
      align-self: center;
      font-size: 0.75rem;
      font-style: italic;
    }
    .chat-input-row {
      display: flex;
      padding: 6px;
      gap: 6px;
      border-top: 1px solid #222;
    }
    .chat-input {
      flex: 1;
      background: #222;
      border: none;
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .chat-input:focus { outline: none; }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-ctrl {
      background: #2c2c2c;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 8px;
      color: #fff;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-ctrl.off { background: #ff9800; color: #000; }

    .actions { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.8; }
    .btn-call { background: #00c853; color: white; }
    .btn-chat { background: #0288d1; color: white; }
    .btn-accept { background: #00c853; color: white; }
    .btn-reject { background: #d50000; color: white; }
    .btn-end { background: #d50000; color: white; width: 100%; }
    .btn-share { background: #00838f; color: white; width: 100%; margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="dialer-card">
  <h3 class="app-title">Web Data Dialer & Chat</h3>

  <!-- 1. DIAL PAGE -->
  <div id="dial-page" class="page-view active">
    <div class="id-banner">
      <div class="id-label">Permanent Caller ID</div>
      <div class="id-row">
        <div id="my-id" class="id-value">Connecting...</div>
        <button id="copy-btn" class="btn-action" onclick="copyCallerID()">Copy</button>
        <button class="btn-action" onclick="changePermanentID()">Edit</button>
      </div>
    </div>
    
    <div class="display-container">
      <input type="text" id="display" class="display" placeholder="Enter Target ID" />
      <button class="btn-action" onclick="pasteFromClipboard()">Paste</button>
    </div>

    <div class="call-mode-row">
      <span>Audio Only</span>
      <label class="switch">
        <input type="checkbox" id="video-toggle" checked>
        <span class="slider"></span>
      </label>
      <span>Enable Video</span>
    </div>

    <div class="actions">
      <button class="btn btn-chat" onclick="startChatOnly()">Chat</button>
      <button class="btn btn-call" onclick="makeCall()">Start Call</button>
    </div>
  </div>

  <!-- 2. INCOMING CALL PAGE -->
  <div id="receive-page" class="page-view">
    <div class="call-avatar incoming-avatar">📞</div>
    <div class="call-status-text">Incoming Call...</div>
    <div id="caller-id-display" class="timer">Unknown Caller</div>
    
    <div class="actions">
      <button class="btn btn-accept" onclick="acceptCall()">Accept</button>
      <button class="btn btn-reject" onclick="rejectCall()">Reject</button>
    </div>
  </div>

  <!-- 3. SPEAKING / VIDEO / CHAT PAGE -->
  <div id="speaking-page" class="page-view">
    <div id="video-container" class="video-viewport">
      <video id="remote-video" class="remote-video" autoplay playsinline></video>
      <video id="local-video" class="local-video" autoplay playsinline muted></video>
    </div>

    <div id="audio-avatar" class="call-avatar" style="display:none;">🎙️</div>
    <div id="call-timer" class="timer">Chat Session</div>

    <div class="chat-container">
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-msg-input" class="chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendChatMessage()" />
        <button class="btn-action" onclick="sendChatMessage()">Send</button>
      </div>
    </div>

    <button class="btn-action btn-share" onclick="shareIDInChat()">Share My ID in Chat</button>

    <div id="call-controls" class="controls-grid">
      <button id="btn-mic" class="btn-ctrl" onclick="toggleMic()">Mic On</button>
      <button id="btn-cam" class="btn-ctrl" onclick="toggleCam()">Cam On</button>
      <button id="btn-flip" class="btn-ctrl" onclick="flipCamera()">Flip Cam</button>
    </div>

    <div class="actions">
      <button id="btn-leave" class="btn btn-end" onclick="hangUp()">End Session</button>
    </div>
  </div>
  
  <audio id="remote-audio" autoplay></audio>
</div>

<script>
  let peer = null;
  let activeCall = null;
  let dataConnection = null;
  let incomingCallInstance = null;
  let localStream = null;
  let currentCallerId = "";
  let callTimerInterval = null;
  let secondsElapsed = 0;
  let ringtoneOscillator = null;
  let ringtoneAudioContext = null;
  let facingMode = "user";
  let targetPeerId = "";

  window.addEventListener('DOMContentLoaded', () => {
    initPermanentPeer();
  });

  function getPermanentID() {
    let storedId = localStorage.getItem('dialer_permanent_id');
    if (!storedId) {
      storedId = 'user-' + Math.random().toString(36).substring(2, 7);
      localStorage.setItem('dialer_permanent_id', storedId);
    }
    return storedId;
  }

  function initPermanentPeer() {
    const permanentId = getPermanentID();
    
    if (peer) {
      peer.destroy();
    }

    peer = new Peer(permanentId);

    peer.on('open', id => {
      currentCallerId = id;
      const idElement = document.getElementById('my-id');
      idElement.innerText = id;
      idElement.style.color = "#00e676";
      idElement.onclick = null;
    });

    peer.on('connection', conn => {
      dataConnection = conn;
      setupDataConnection();
      if (!activeCall) {
        setupChatOnlyView(conn.peer);
        showPage('speaking-page');
      }
    });

    peer.on('call', call => {
      incomingCallInstance = call;
      document.getElementById('caller-id-display').innerText = call.peer;
      showPage('receive-page');
      playRingtone();
    });

    peer.on('error', err => {
      console.error("PeerJS Error:", err);
      if (err.type === 'unavailable-id') {
        alert("This ID is already active in another window. Generating a new ID.");
        localStorage.removeItem('dialer_permanent_id');
        initPermanentPeer();
      } else if (err.type === 'peer-unavailable') {
        appendChatMessage("Target ID is offline or invalid.", "system");
      } else {
        const idElement = document.getElementById('my-id');
        idElement.innerText = "Connection Error";
        idElement.style.color = "#ff5252";
      }
    });
  }

  function showPage(pageId) {
    document.querySelectorAll('.page-view').forEach(el => el.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
  }

  function startChatOnly() {
    targetPeerId = document.getElementById('display').value.trim();
    
    setupChatOnlyView(targetPeerId || "Direct Chat");
    showPage('speaking-page');

    if (targetPeerId) {
      appendChatMessage("Connecting to " + targetPeerId + "...", "system");
      if (peer && !peer.destroyed) {
        dataConnection = peer.connect(targetPeerId);
        setupDataConnection();
      }
    } else {
      appendChatMessage("Chat opened. Type a target ID above to connect.", "system");
    }
  }

  function setupChatOnlyView(recipient) {
    document.getElementById('video-container').style.display = 'none';
    document.getElementById('audio-avatar').style.display = 'none';
    document.getElementById('call-controls').style.display = 'none';
    document.getElementById('call-timer').innerText = "Chat with: " + (recipient || "Unknown");
    document.getElementById('btn-leave').innerText = "Close Chat";
  }

  async function makeCall() {
    const targetId = document.getElementById('display').value.trim();
    if (!targetId) return alert("Please enter a Target ID to call.");

    const wantsVideo = document.getElementById('video-toggle').checked;
    const mediaReady = await obtainMediaStream(wantsVideo);
    if (!mediaReady) return;

    if (peer && !peer.destroyed) {
      dataConnection = peer.connect(targetId);
      setupDataConnection();

      const call = peer.call(targetId, localStream);
      activeCall = call;

      setupActiveCallView(wantsVideo);
      showPage('speaking-page');
      startTimer();

      call.on('stream', remoteStream => {
        attachRemoteStream(remoteStream);
      });

      call.on('close', resetToDialPage);
      call.on('error', err => {
        console.error("Call error:", err);
        resetToDialPage();
      });
    }
  }

  async function acceptCall() {
    stopRingtone();
    if (!incomingCallInstance) return;

    const wantsVideo = document.getElementById('video-toggle').checked;
    const mediaReady = await obtainMediaStream(wantsVideo);
    if (!mediaReady) return;

    incomingCallInstance.answer(localStream);
    activeCall = incomingCallInstance;

    setupActiveCallView(wantsVideo);
    showPage('speaking-page');
    startTimer();

    activeCall.on('stream', remoteStream => {
      attachRemoteStream(remoteStream);
    });

    activeCall.on('close', resetToDialPage);
    activeCall.on('error', err => {
      console.error("Call error:", err);
      resetToDialPage();
    });
  }

  function setupDataConnection() {
    if (!dataConnection) return;
    
    dataConnection.on('open', () => {
      appendChatMessage("Connected to " + dataConnection.peer, "system");
      document.getElementById('call-timer').innerText = "Chat with: " + dataConnection.peer;
    });

    dataConnection.on('data', data => {
      appendChatMessage(data, 'them');
    });

    dataConnection.on('close', () => {
      appendChatMessage("Connection closed.", "system");
    });

    dataConnection.on('error', err => {
      console.error("Data channel error:", err);
    });
  }

  function sendChatMessage() {
    const input = document.getElementById('chat-msg-input');
    const msg = input.value.trim();
    if (!msg) return;

    if (dataConnection && dataConnection.open) {
      dataConnection.send(msg);
      appendChatMessage(msg, 'me');
      input.value = '';
    } else {
      const targetId = document.getElementById('display').value.trim() || targetPeerId;
      if (targetId && peer && !peer.destroyed) {
        appendChatMessage("Connecting to target...", "system");
        dataConnection = peer.connect(targetId);
        setupDataConnection();
        dataConnection.on('open', () => {
          dataConnection.send(msg);
          appendChatMessage(msg, 'me');
          input.value = '';
        });
      } else {
        appendChatMessage("Please enter a Target ID to send messages.", "system");
      }
    }
  }

  function shareIDInChat() {
    if (currentCallerId) {
      const msg = "My Caller ID is: " + currentCallerId;
      document.getElementById('chat-msg-input').value = msg;
      sendChatMessage();
    }
  }

  function appendChatMessage(text, sender) {
    const box = document.getElementById('chat-messages');
    const msgEl = document.createElement('div');
    msgEl.className = `msg ${sender}`;
    msgEl.innerText = text;
    box.appendChild(msgEl);
    box.scrollTop = box.scrollHeight;
  }

  async function obtainMediaStream(includeVideo) {
    stopLocalMediaStream();
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: true,
        video: includeVideo ? { facingMode: facingMode } : false
      });
      document.getElementById('local-video').srcObject = localStream;
      return true;
    } catch(err) {
      console.warn("Could not access full media, attempting audio-only:", err);
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        document.getElementById('local-video').srcObject = null;
        return true;
      } catch(e) {
        alert("Microphone/Camera permission is required to place calls.");
        return false;
      }
    }
  }

  function stopLocalMediaStream() {
    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }
  }

  function attachRemoteStream(remoteStream) {
    const remoteVideo = document.getElementById('remote-video');
    const remoteAudio = document.getElementById('remote-audio');
    
    remoteVideo.srcObject = remoteStream;
    remoteAudio.srcObject = remoteStream;
  }

  function setupActiveCallView(hasVideo) {
    document.getElementById('call-controls').style.display = 'grid';
    document.getElementById('btn-leave').innerText = "End Call";

    const videoViewport = document.getElementById('video-container');
    const audioAvatar = document.getElementById('audio-avatar');
    if (hasVideo) {
      videoViewport.style.display = 'block';
      audioAvatar.style.display = 'none';
    } else {
      videoViewport.style.display = 'none';
      audioAvatar.style.display = 'flex';
    }
  }

  function toggleMic() {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      audioTrack.enabled = !audioTrack.enabled;
      const btn = document.getElementById('btn-mic');
      btn.innerText = audioTrack.enabled ? "Mic On" : "Mic Off";
      btn.classList.toggle('off', !audioTrack.enabled);
    }
  }

  function toggleCam() {
    if (!localStream) return;
    const videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) {
      videoTrack.enabled = !videoTrack.enabled;
      const btn = document.getElementById('btn-cam');
      btn.innerText = videoTrack.enabled ? "Cam On" : "Cam Off";
      btn.classList.toggle('off', !videoTrack.enabled);
    }
  }

  async function flipCamera() {
    facingMode = (facingMode === "user") ? "environment" : "user";
    const videoTrack = localStream ? localStream.getVideoTracks()[0] : null;
    const isVideoEnabled = videoTrack ? videoTrack.enabled : true;

    await obtainMediaStream(true);

    if (activeCall && activeCall.peerConnection) {
      const videoSender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
      if (videoSender && localStream && localStream.getVideoTracks()[0]) {
        videoSender.replaceTrack(localStream.getVideoTracks()[0]);
      }
    }
    
    if (!isVideoEnabled && localStream && localStream.getVide
